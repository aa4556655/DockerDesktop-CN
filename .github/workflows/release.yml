name: Release DockerDesktop package

on:
  schedule:
    - cron: '0 0 * * *' # scheduled at 08:00 everyday
  workflow_dispatch: # on button click

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
